# Points every service at a generated shared Secret instead of the hardcoded defaults
# that ship in the chart and in the service images.
#
#   helm upgrade --install harness harness/harness -n <ns> -f override-secrets.yaml
#
# The Secret is created by templates/harness-shared-secrets.yaml. Left-hand names are
# the chart's variable names and are fixed; right-hand names are keys in that Secret.
# Variables sharing a key must share a value - that is what keeps two services able to
# authenticate each other. Precedence is ESO, then external Kubernetes Secret, then
# secrets.default, so these entries win without editing the shipped defaults.
#
# 51 charts, 470 variables, 43 secrets, chart 0.47.0. Regenerate when the chart moves.
#
# unified-data-platform is shaped differently because it reads a secretKeyRef from
# secrets.<name>.secretName/.key rather than using the env helper, and createSmpSecret
# makes it mint its own Secret from hardcoded values. Hence the different entries.
#
# Two entries look wrong but are not:
#
# - OPA_SERVER_SECRET and CODE_SERVICE_SECRET (platform-service),
#   SPICE_DB_SERVICE_AUTH_TOKEN (access-control) and SECRET_CONNECTOR_SERVICE_SECRET
#   (audit-event-streaming) are not in their chart's secrets.default - the chart writes
#   them into a ConfigMap. Naming them here still works: the env list is a union of
#   secrets.default, kubernetesSecrets and ESO keys, and an env entry beats envFrom.
# - iacm-manager's STO_SERVICE_GLOBAL_TOKEN is set through stoServiceGlobalToken.name
#   and .key rather than kubernetesSecrets. That chart renders the variable with
#   manageAppEnv and also includes the union helper, so naming it in kubernetesSecrets
#   emits it twice, and Kubernetes rejects an upgrade patch on a duplicate env name.
# - pipeline-service's FLEX_ENFORCEMENT_SERVICE_SECRET follows the running value
#   (jwtNextGenManagerSecret), not its chart default, which is a dummy. It and
#   orchestration-engine both run the former on flexEnforcementClient.serviceSecret,
#   and following the default would split the pair.
#
# Not fixed by this file:
#
# - The chaos CronJob bg-processor-every-2h is missing the
#   renderSecretsAsEnvironmentVariables include its 24h sibling has, so it keeps the
#   old values through envFrom. Needs a chart change.
# - Seven config paths are baked into the service images with no environment variable
#   behind them: componentServiceSecret (component-service),
#   coverageServiceConfig.token (iacm-manager), nextGen.iroManagerServiceSecret and
#   nextGen.monitoringManagerServiceSecret (ng-manager),
#   yamlSchemaClientConfig.yamlSchemaHttpClientMap.srm.secret (orchestration-engine,
#   pipeline-service) and featureFlagConfig.fmeConfig.splitToken (ci-manager).
# - Each service's own Secret still holds its original default. Nothing reads it, but
#   the old value stays readable in the namespace until the chart stops emitting it.
# - Out of scope: external credentials (OAuth, cloud keys, SMTP, Split/FME), datastore
#   passwords the bootstrap chart already generates per install, and
#   SECURITY_SECRETS_ENCRYPTION_KEY, where a new value strands existing ciphertext.

global:
  sharedSecrets:
    enabled: true
    secretName: harness-shared-secrets
    # Disabling this while keeping the rest of the file points every service at a
    # Secret that does not exist. Remove both together.
    # Pin a secret instead of generating it:
    # values:
    #   artifactRegistryWebhookSecret: "<your value>"

