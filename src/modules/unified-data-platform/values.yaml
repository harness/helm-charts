config-service:
  image:
    imagePullSecrets: []
  createSmpSecret: false
  configService:
    kafka:
      enabled: false
      tlsUserSecret: ""
      tlsTruststoreSecret: ""

schema-service:
  image:
    imagePullSecrets: []
  createSmpSecret: false
  schemaService:
    kafka:
      enabled: false
      tlsUserSecret: ""
      tlsTruststoreSecret: ""

onboarding-service:
  image:
    imagePullSecrets: []
  createSmpSecret: false
  onboardingService:
    kafka:
      enabled: false
      tlsUserSecret: ""
      tlsTruststoreSecret: ""

query-service:
  image:
    imagePullSecrets: []
  createSmpSecret: false
  queryService:
    serviceAccount:
      name: "default"
    connectionSecrets: []
    appConfig:
      # On SMP, Kafka is disabled so no change-event-driven cache invalidation happens.
      # Lower cache TTLs to 15m so schema and mapping config changes propagate within one
      # polling cycle instead of waiting up to 1 day (the SaaS default).
      grpcClients:
        schema-service:
          cache-duration: 15m
        config-service:
          cache-duration: 15m
      queryService:
        kafka:
          enabled: false
          tlsUserSecret: ""
          tlsTruststoreSecret: ""
        data:
          connections: []

dashboard-ui:
  image:
    imagePullSecrets: []
