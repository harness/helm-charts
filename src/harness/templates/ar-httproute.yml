{{- /* /har/* routing on Envoy Gateway clusters. EG ignores the nginx
     annotations in values.yaml, so we encode the Host rewrite + /har strip
     here. Delete once harness-common's gatewayAPI.upstreamHostOverride emits
     this same 3-piece pattern (RequestHeaderModifier x-rewrite-host +
     HTTPRouteFilter urlRewrite.hostname.type: Header + path strip). */ -}}
{{- if .Values.global.gatewayAPI.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: registry-api-har-rewrite
  namespace: {{ .Release.Namespace }}
spec:
  urlRewrite:
    hostname:
      type: Header
      header: x-rewrite-host
    path:
      type: ReplaceRegexMatch
      replaceRegexMatch:
        pattern: /har(/|$)(.*)
        substitution: /\2
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: registry-api-har
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ default "envoy-gateway" (dig "gatewayName" "" .Values.global.gatewayAPI) }}
      namespace: {{ .Release.Namespace }}
  hostnames:
    - {{ index .Values.global.ingress.hosts 0 | quote }}
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /har(/|$)(.*)
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-rewrite-host
                value: registry-api
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: registry-api-har-rewrite
      backendRefs:
        - name: registry-api
          port: 80
{{- end }}
