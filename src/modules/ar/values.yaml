# Harness-internal defaults for this module (not customer-facing). Where a value goes: src/modules/README.md
# Secret mappings (<ENV_VAR>: <key in harness-shared-secrets>) apply when global.sharedSecrets.enabled=true.

ipqs-service:
  secrets:
    smpSharedKubernetesSecrets:
      - secretName: harness-shared-secrets
        keys:
          IPQS_JWT_SECRET: jwtNextGenManagerSecret
registry-api:
  secrets:
    smpSharedKubernetesSecrets:
      - secretName: harness-shared-secrets
        keys:
          GITNESS_REGISTRY_HTTP_SECRET: gitnessRegistryHttpSecret
          GITNESS_WEBHOOK_INTERNAL_SECRET: artifactRegistryWebhookSecret
          HARNESS_JWT_BEARER_SECRET: jwtAuthSecret
          HARNESS_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_CDE_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_CIMANAGER_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_CODESEARCH_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_COMPONENT_SERVICE_CLIENT_JWT_SECRET: jwtAuthSecret
          HARNESS_SERVICES_GENAISERVICE_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_IACM_MANAGER_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_IAC_SERVER_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_IDENTITY_JWT_SECRET: jwtIdentityServiceSecret
          HARNESS_SERVICES_IDP_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_IPQS_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_MANAGER_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_NGMANAGER_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_OPA_CLIENT_JWT_SECRET: jwtAuthSecret
          HARNESS_SERVICES_RESOURCE_GROUP_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_SEMANTIC_SEARCH_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_SSCA_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_STO_JWT_SECRET: jwtNextGenManagerSecret
  config:
    REGISTRY_ENABLE_ES: "false"
    HARNESS_REGISTRY_EVENTS_ARTIFACT_QUARANTINE_STREAM: "ssca_ar_artifact_quarantine"
    HARNESS_REGISTRY_EVENTS_ENABLED: "true"
  ingress:
    objects:
      - annotations:
          nginx.ingress.kubernetes.io/rewrite-target: $1$2
          nginx.ingress.kubernetes.io/use-regex: "true"
          nginx.ingress.kubernetes.io/upstream-vhost: registry-api
          nginx.ingress.kubernetes.io/configuration-snippet: |
            set $do_redirect "";
            if ($host = "{{ index .Values.global.ingress.hosts 0 }}") { set $do_redirect "${do_redirect}H"; }
            if ($request_uri ~ "^/har/api/") { set $do_redirect "${do_redirect}U"; }
            if ($do_redirect = "HU") { return 308 {{ .Values.global.loadbalancerURL }}/gateway$request_uri; }
        paths:
          - path: "{{ .Values.global.ingress.pathPrefix }}/har(/|$)(.*)"
      - annotations:
          nginx.ingress.kubernetes.io/use-regex: "true"
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
        paths:
          - path: "/v2(/|$).*"
          - path: "/pkg(/|$).*"
          - path: "/generic(/|$).*"
          - path: "/maven(/|$).*"
registry-async-service:
  secrets:
    smpSharedKubernetesSecrets:
      - secretName: harness-shared-secrets
        keys:
          HARNESS_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_IPQS_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_NGMANAGER_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_OPA_CLIENT_JWT_SECRET: jwtAuthSecret
          REGISTRY_ASYNC_SERVICE_JWT_SECRET: jwtNextGenManagerSecret
  config:
    REGISTRY_ENABLE_ES: "false"
    KAFKA_CONFLUENT_BOOTSTRAP_SERVER_URLS: "kafka-platform-kafka-bootstrap:9093"
    KAFKA_CONFLUENT_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: "https"
    KAFKA_CONFLUENT_SECURITY_PROTOCOL: "SSL"
    KAFKA_PRODUCER_TLS_CA_FILE: "/etc/kafka/cluster-ca/ca.crt"
    KAFKA_PRODUCER_TLS_CERT_FILE: "/etc/kafka/certs/user.crt"
    KAFKA_PRODUCER_TLS_KEY_FILE: "/etc/kafka/certs/user.key"
  extraVolumes:
    - name: kafka-certs
      secret:
        secretName: kafka-platform-registry-async-service
        defaultMode: 0444
    - name: kafka-cluster-ca
      secret:
        secretName: kafka-platform-cluster-ca-cert
        defaultMode: 0444
  extraVolumeMounts:
    - name: kafka-certs
      mountPath: /etc/kafka/certs
      readOnly: true
    - name: kafka-cluster-ca
      mountPath: /etc/kafka/cluster-ca
      readOnly: true
registry-processor:
  secrets:
    smpSharedKubernetesSecrets:
      - secretName: harness-shared-secrets
        keys:
          HARNESS_JWT_BEARER_SECRET: jwtAuthSecret
          HARNESS_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_COMPONENT_SERVICE_CLIENT_JWT_SECRET: jwtAuthSecret
          HARNESS_SERVICES_IPQS_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_MANAGER_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_NGMANAGER_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_SERVICES_OPA_CLIENT_JWT_SECRET: jwtAuthSecret
          REGISTRY_PROCESSOR_JWT_SECRET: jwtNextGenManagerSecret
  config:
    HARNESS_SERVICES_COMPONENT_SERVICE_IGNORE: "true"
    GITNESS_REGISTRY_POST_PROCESSING_CONCURRENCY: "10"
  ingress:
    objects:
      - annotations:
          nginx.ingress.kubernetes.io/rewrite-target: $1$2
          nginx.ingress.kubernetes.io/use-regex: "true"
        paths:
          - path: '{{ .Values.global.ingress.pathPrefix }}/har-processor(/|$)(.*)'
