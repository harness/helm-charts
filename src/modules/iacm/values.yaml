# Harness-internal defaults for this module (not customer-facing). Where a value goes: src/modules/README.md
# Secret mappings (<ENV_VAR>: <key in harness-shared-secrets>) apply when global.sharedSecrets.enabled=true.

iac-server:
  secrets:
    smpSharedKubernetesSecrets:
      - secretName: harness-shared-secrets
        keys:
          AUDIT_AUTH_SECRET: jwtNextGenManagerSecret
          HARNESS_CODE_AUTH_SECRET: jwtNextGenManagerSecret
          NG_MANAGER_AUTH_SECRET: jwtNextGenManagerSecret
          PIPELINE_SERVICE_AUTH_SECRET: jwtNextGenManagerSecret
          PLATFORM_SECRET_KEY: jwtNextGenManagerSecret
          POLICY_MGMT_AUTH_SECRET: jwtIdentityServiceSecret
          RESOURCE_HIERARCHY_SERVICE_SECRET: jwtNextGenManagerSecret
          SERVICE_GLOBAL_TOKEN: iacmServiceToken
  config:
    RHS_ENABLED: "true"
  createDb:
    image:
      repository: "harnesssecure/postgresql"
      tag: "14.20-debian"
  postgres:
    image:
      repository: "harnesssecure/postgresql"
      tag: "14.20-debian"
iacm-manager:
  # JFR init container image
  jfr:
    image:
      registry: docker.io
      repository: busybox
      tag: "1.37.0"
      digest: ""
  secrets:
    smpSharedKubernetesSecrets:
      - secretName: harness-shared-secrets
        keys:
          ACCESS_CONTROL_SECRET: jwtNextGenManagerSecret
          CACHE_SERVICE_GLOBAL_TOKEN: cacheServiceToken
          GITNESS_JWT_SECRET: jwtNextGenManagerSecret
          HARNESS_REGISTRY_JWT_SECRET: jwtNextGenManagerSecret
          HSQS_AUTH_TOKEN: queueServiceSecret
          IACM_HARNESS_INFRACOST_API: iacmServiceToken
          IACM_SERVICE_GLOBAL_TOKEN: iacmServiceToken
          JWT_AUTH_SECRET: jwtAuthSecret
          JWT_IDENTITY_SERVICE_SECRET: jwtIdentityServiceSecret
          LOG_SERVICE_GLOBAL_TOKEN: logServiceToken
          MANAGER_SECRET: jwtNextGenManagerSecret
          NEXT_GEN_MANAGER_SECRET: jwtNextGenManagerSecret
          OPA_SERVER_SECRET: platformAuthToken
          PLATFORM_CONFIG_SERVICE_SECRET: platformConfigServiceSecret
          RESOURCE_HIERARCHY_SERVICE_SECRET: jwtNextGenManagerSecret
          SECRET_CONNECTOR_SERVICE_SECRET: secretConnectorServiceSecret
          SSCA_SERVICE_SECRET: platformAuthToken
          TI_SERVICE_GLOBAL_TOKEN: tiSvcGlobalToken
          VERIFICATION_SERVICE_SECRET: verificationServiceSecret
  config:
    RHS_ENABLED: "true"
    HARNESS_IMAGE_REPOSITORY: harnesssecure
