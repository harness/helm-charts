# Where a value goes: src/modules/README.md
# Not gated by global.sharedSecrets.enabled (secretKeyRef, not the env helper): these services need
# harness-shared-secrets to exist, so global.sharedSecrets.enabled must be true when this module is used.

config-service:
  image:
    imagePullSecrets: []
  createSmpSecret: false
  secrets:
    authzServiceSecret:
      secretName: harness-shared-secrets
      key: jwtNextGenManagerSecret
    udpInternalSecret:
      secretName: harness-shared-secrets
      key: udpInternalSecret
  secretValues:
    UDP_INTERNAL_SECRET: "x6ee13sGJdtzccBJhgHfMXtMTE37EBJ9wIrXH01OUrOcRfbwPLo5oaSdplXnGlAq"
    AUTHZ_SERVICE_SECRET: "IC04LYMBf1lDP5oeY4hupxd4HJhLmN6azUku3xEbeE3SUx5G3ZYzhbiwVtK4i7AmqyU9OZkwB4v8E9qM"
  configService:
    appConfig:
      # Enable the auth-lib UserProfile cache (off by default). Without it every
      # authenticated request re-pages all of the caller's role assignments from
      # access-control; for large-RBAC principals that heavy, uncached fetch can
      # starve the JVM and trip liveness probes. The cache serves the resolved
      # profile for the TTL instead, matching query-service.
      harness:
        auth:
          cache:
            enabled: true
            profile:
              enabled: true
              ttl-seconds: 300
              max-size: 2000
            token-validation:
              enabled: true
              ttl-seconds: 300
              max-size: 2000
    kafka:
      enabled: false
      tlsUserSecret: ""
      tlsTruststoreSecret: ""

schema-service:
  image:
    imagePullSecrets: []
  createSmpSecret: false
  secrets:
    authzServiceSecret:
      secretName: harness-shared-secrets
      key: jwtNextGenManagerSecret
    udpInternalSecret:
      secretName: harness-shared-secrets
      key: udpInternalSecret
  secretValues:
    UDP_INTERNAL_SECRET: "x6ee13sGJdtzccBJhgHfMXtMTE37EBJ9wIrXH01OUrOcRfbwPLo5oaSdplXnGlAq"
    AUTHZ_SERVICE_SECRET: "IC04LYMBf1lDP5oeY4hupxd4HJhLmN6azUku3xEbeE3SUx5G3ZYzhbiwVtK4i7AmqyU9OZkwB4v8E9qM"
  schemaService:
    appConfig:
      # See config-service note above: enable the auth-lib UserProfile cache so
      # the per-request role-assignment fetch is served from cache instead of
      # re-paging access-control on every authenticated call.
      harness:
        auth:
          cache:
            enabled: true
            profile:
              enabled: true
              ttl-seconds: 300
              max-size: 2000
            token-validation:
              enabled: true
              ttl-seconds: 300
              max-size: 2000
    kafka:
      enabled: false
      tlsUserSecret: ""
      tlsTruststoreSecret: ""

onboarding-service:
  image:
    imagePullSecrets: []
  createSmpSecret: false
  secrets:
    udpInternalSecret:
      secretName: harness-shared-secrets
      key: udpInternalSecret
  secretValues:
    UDP_INTERNAL_SECRET: "x6ee13sGJdtzccBJhgHfMXtMTE37EBJ9wIrXH01OUrOcRfbwPLo5oaSdplXnGlAq"
  onboardingService:
    serviceAccount:
      create: true
      name: onboarding-service
    appConfig:
      onboarding-service:
        provider-groups:
          include:
            - name: "02_smp"
    kafka:
      enabled: false
      tlsUserSecret: ""
      tlsTruststoreSecret: ""

query-service:
  image:
    imagePullSecrets: []
  createSmpSecret: false
  secrets:
    authzServiceSecret:
      secretName: harness-shared-secrets
      key: jwtNextGenManagerSecret
    udpInternalSecret:
      secretName: harness-shared-secrets
      key: udpInternalSecret
  secretValues:
    UDP_INTERNAL_SECRET: "x6ee13sGJdtzccBJhgHfMXtMTE37EBJ9wIrXH01OUrOcRfbwPLo5oaSdplXnGlAq"
    AUTHZ_SERVICE_SECRET: "IC04LYMBf1lDP5oeY4hupxd4HJhLmN6azUku3xEbeE3SUx5G3ZYzhbiwVtK4i7AmqyU9OZkwB4v8E9qM"
  queryService:
    serviceAccount:
      name: "default"
    connectionSecrets: []
    appConfig:
      # On SMP, Kafka is disabled so no change-event-driven cache invalidation happens.
      # Lower cache TTLs to 15m so schema and mapping config changes propagate within one
      # polling cycle instead of waiting up to 1 day (the SaaS default).
      grpcClients:
        schema-service:
          cache-duration: 15m
        config-service:
          cache-duration: 15m
      queryService:
        kafka:
          enabled: false
          tlsUserSecret: ""
          tlsTruststoreSecret: ""
        data:
          connections: []

dashboard-ui:
  image:
    imagePullSecrets: []
