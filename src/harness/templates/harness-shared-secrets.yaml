{{/*
Shared secrets for Harness internal service-to-service authentication, replacing the
hardcoded defaults from the chart and the service images. Each key is one rotation
unit: every service that must agree on a secret reads the same key.

Per key, in order: the value already in the Secret, then
global.sharedSecrets.values.<key>, then a freshly generated random value. The first
step reads the cluster, so `helm template` and client-side dry runs emit new values on
every render - install and upgrade with `helm upgrade --install`.
*/}}
{{- $cfg := dict }}
{{- if (.Values.global).sharedSecrets }}{{- $cfg = .Values.global.sharedSecrets }}{{- end }}
{{- $enabled := true }}
{{- if hasKey $cfg "enabled" }}{{- $enabled = $cfg.enabled }}{{- end }}
{{- if $enabled }}
{{- $name := "harness-shared-secrets" }}
{{- if hasKey $cfg "secretName" }}{{- $name = $cfg.secretName }}{{- end }}
{{- $provided := dict }}
{{- if hasKey $cfg "values" }}{{- $provided = $cfg.values }}{{- end }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $current := dict }}
{{- if and $existing $existing.data }}{{- $current = $existing.data }}{{- end }}
{{- $keys := dict
      "artifactRegistryWebhookSecret" 64
      "cacheServiceToken" 64
      "commandLibraryPublishingSecret" 64
      "etServiceSecret" 80
      "gitnessRegistryHttpSecret" 88
      "harnessCodeWebhookSecret" 64
      "harnessIdServiceSecret" 64
      "iacmServiceToken" 64
      "idpServiceSecret" 64
      "jwtAidaCodeSecret" 80
      "jwtAuthSecret" 80
      "jwtCannySecret" 64
      "jwtDataHandlerSecret" 74
      "jwtDirectoryServiceSecret" 64
      "jwtExternalServiceSecret" 64
      "jwtIdentityServiceSecret" 68
      "jwtMarketPlaceSecret" 80
      "jwtMultiAuthSecret" 80
      "jwtNextGenManagerSecret" 80
      "jwtPasswordSecret" 64
      "jwtPasswordServiceSecret" 64
      "jwtRelicxSecret" 64
      "jwtSecret" 80
      "jwtSplitSecret" 80
      "jwtSsoRedirectSecret" 80
      "jwtTraceableSecret" 64
      "jwtZendeskSecret" 64
      "logServiceToken" 64
      "managerToCommandLibrarySecret" 64
      "platformAuthToken" 64
      "platformConfigServiceSecret" 64
      "queueServiceSecret" 64
      "qwietSharedSecret" 80
      "resourceHierarchyServiceSecret" 64
      "secretConnectorServiceSecret" 64
      "spiceDbAuthToken" 64
      "stoAppToken" 64
      "stoServiceToken" 64
      "tiServiceToken" 64
      "tiSvcGlobalToken" 64
      "udpInternalSecret" 64
      "userVerificationSecret" 80
      "verificationServiceSecret" 64
}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: harness
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- range $key, $length := $keys }}
  {{- $value := "" }}
  {{- if hasKey $current $key }}
  {{- $value = index $current $key }}
  {{- else if hasKey $provided $key }}
  {{- $value = index $provided $key | toString | b64enc }}
  {{- else }}
  {{- $value = randAlphaNum (int $length) | b64enc }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
