# Harness-internal defaults for this module (not customer-facing). Where a value goes: src/modules/README.md
# Secret mappings (<ENV_VAR>: <key in harness-shared-secrets>) apply when global.sharedSecrets.enabled=true.

component-analysis-service:
  # JFR init container image
  jfr:
    image:
      registry: docker.io
      repository: harnesssecure/ubi
      tag: "ubi9-minimal-curated"
      digest: ""
  secrets:
    smpSharedKubernetesSecrets:
      - secretName: harness-shared-secrets
        keys:
          COMPONENT_SERVICE_SECRET: jwtNextGenManagerSecret
          GENAI_SERVICE_SECRET: jwtNextGenManagerSecret
          HARNESS_CODE_SERVICE_SECRET: jwtNextGenManagerSecret
          JWT_AUTH_SECRET: jwtAuthSecret
          JWT_IDENTITY_SERVICE_SECRET: jwtIdentityServiceSecret
          NG_MANAGER_SERVICE_SECRET: jwtNextGenManagerSecret
          POLICY_MGMT_SERVICE_SECRET: jwtAuthSecret
          SECRET_CONNECTOR_SERVICE_SECRET: secretConnectorServiceSecret
          SSCA_MANAGER_SERVICE_SECRET: jwtNextGenManagerSecret
component-service:
  # JFR init container image
  jfr:
    image:
      registry: docker.io
      repository: harnesssecure/ubi
