bootstrap:
  networking:
    nginx:
      controller:
        config:
          # Trust X-Forwarded-Proto from envoy-gateway so nginx does not
          # force-ssl-redirect HTTP traffic forwarded from the gateway.
          use-forwarded-headers: "true"
  database:
    postgresql:
      image:
        repository: "harnesssecure/postgresql"
        tag: "14.20-debian"
    redis:
      metrics:
        image:
          repository: harnesssecure/redis_exporter
          tag: 1.94.0-jammy   
change-data-capture:
  config:
    ENV: "SMP"
next-gen-ui:
  config:
    ENV: "SMP"
  ingress:
    objects:
      # serves the UI at the root path; skipped when CG owns the root ingress
      - name: harness-ui
        when:
          not:
            key: global.cg.enabled
        annotations:
          nginx.ingress.kubernetes.io/use-regex: "true"
        paths:
          - path: /(.*)
platform-ui:
  config:
    ENV: "SMP"
ng-auth-ui:
  config:
    ENV: "SMP"
